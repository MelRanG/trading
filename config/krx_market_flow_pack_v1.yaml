    expected_pattern: ETF_INVESTOR_TRADING_20200101_20260731*.csv
    minimum_fields: [일자, 투자자구분, 매도거래량, 매수거래량, 순매수거래량]
  - id: ETF_INSTRUMENT_INVESTOR_TRADING
    menu: 통계 > 기본 통계 > 증권상품 > ETF > 투자자별 거래실적(개별종목)
    filters: 현재 V79 ETF universe 각 종목, 기간=2020-01-01~2026-07-31, 일별
    expected_pattern: ETF_INSTRUMENT_INVESTOR_TRADING_*_20200101_20260731*.csv
    minimum_fields: [일자, 종목코드, 투자자구분, 매도거래량, 매수거래량, 순매수거래량]

