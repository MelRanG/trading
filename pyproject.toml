[project]
name = "quant-harness-v99-candidate-selection"
version = "104.0.0"
description = "Deep CandidateSelectionAgent error attribution, ablation, and walk-forward candidate research"
requires-python = ">=3.10"
dependencies = [
  "pandas==2.2.3",
  "numpy==2.3.5",
  "PyYAML==6.0.3",
  "tabulate==0.9.0",
  "scipy==1.17.0",
  "psycopg[binary]==3.3.9",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
sec = ["edgartools==6.0.0"]
test = ["pytest==9.0.2"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
